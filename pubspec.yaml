name: home_service_app
description: Ev və Ailə Xidmətləri — AI + geo home service platform
publish_to: 'none'
version: 1.0.0+7

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  dartz: ^0.10.1
  get_it: ^8.0.3
  go_router: ^14.8.1
  record: ^6.0.0
  audio_session: ^0.1.25
  just_audio: ^0.9.46
  geolocator: ^13.0.4
  google_maps_flutter: ^2.12.1
  intl: ^0.20.2
  path_provider: ^2.1.5
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  image_picker: ^1.1.2
  google_fonts: ^6.2.1
  flutter_html: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/logo-color.jpg
  remove_alpha_ios: true
  adaptive_icon_background: "#08215B"
  adaptive_icon_foreground: assets/brand/logo-color.jpg
  adaptive_icon_foreground_inset: 16

flutter:
  uses-material-design: true

  assets:
    - assets/brand/logo-light.jpg
    - assets/brand/logo-color.jpg
    - assets/audio/voice_greeting_az.m4a
    - assets/audio/voice_greeting_en.m4a
    - assets/audio/voice_greeting_ru.m4a
    - assets/audio/voice_accepted_az.m4a
    - assets/audio/voice_accepted_en.m4a
    - assets/audio/voice_accepted_ru.m4a
    - assets/audio/voice_greeting_az.mp3
    - assets/audio/voice_greeting_en.mp3
    - assets/audio/voice_greeting_ru.mp3
    - assets/audio/voice_accepted_az.mp3
    - assets/audio/voice_accepted_en.mp3
    - assets/audio/voice_accepted_ru.mp3
